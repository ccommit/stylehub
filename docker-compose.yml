# =========================================================================
# StyleHub 로컬 개발용 compose — MySQL·Redis 만 띄운다.
#
# 운영은 이 파일을 쓰지 않는다. Jenkins 가 jar 를 운영서버로 SCP 전송하고
# systemd(stylehub.service)로 재시작하는 네이티브 배포이며, MySQL·Redis 도 서버에 직접 설치되어 있다
# (Jenkinsfile, scripts/deploy-remote.sh 참고). 예전 GHCR 이미지 배포용 app 서비스는 그래서 뺐다.
#
# 로컬 실행 순서 (저장소 루트에서)
#   1) docker compose up -d                                   # MySQL·Redis 기동, healthy 까지 대기하려면 --wait
#   2) SPRING_PROFILES_ACTIVE=local ./gradlew bootRun          # application-local.properties 로 접속
#   3) curl http://localhost:8080/actuator/health              # {"status":"UP"} 확인
#   정리: docker compose down  (데이터 볼륨은 남는다. 볼륨까지 지우는 -v 는 로컬 데이터가 모두 사라진다)
#
# 값 바꾸기
#   아래 LOCAL_* 변수는 모두 선택이며, 비워 두면 여기 적힌 로컬 기본값을 쓴다.
#   application-local.properties 도 같은 변수 이름·기본값을 읽으므로, 셸에서 export 하면 compose 와 앱에 함께 적용된다.
#   (.env 파일에 적으면 compose 만 읽고 bootRun 은 읽지 않는다 — 그때는 앱 쪽에도 같은 값을 export 해야 한다.)
#   이미 로컬에 MySQL(3306)·Redis(6379)가 떠 있으면 포트가 겹쳐 기동이 실패하므로 예를 들어
#     export LOCAL_MYSQL_PORT=13306 LOCAL_REDIS_PORT=16379
#   로 바꾼 뒤 1)·2)를 실행한다.
#   MySQL 비밀번호는 볼륨이 비어 있는 첫 기동 때만 적용된다. 이후 바꾸려면 MySQL 안에서 직접 변경해야 한다.
#
# 이미지 버전
#   운영서버에 설치된 MySQL·Redis 의 정확한 버전은 저장소에서 확인할 수 없다.
#   MySQL 은 운영 DDL 스크립트(scripts/db)가 기준으로 삼는 8 계열, Redis 는 CI(.github/workflows/ci.yml)와 같은 7 계열로 맞췄다.
#
# 포트를 127.0.0.1 에만 여는 이유
#   포트 앞 주소를 생략하면 Docker 가 모든 인터페이스(0.0.0.0)에 열어, 알려진 로컬 비밀번호로 같은 네트워크의 다른 기기가 접속할 수 있다.
# =========================================================================

name: stylehub-local

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-root}
      # 앱은 root 가 아닌 전용 계정으로 접속한다(운영 DB_USERNAME 기본값과 같은 이름). 이 계정은 stylehub DB 에 대한 전체 권한을 받는다.
      MYSQL_DATABASE: stylehub
      MYSQL_USER: stylehub
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-stylehub}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${LOCAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 로 TCP 접속을 확인한다. -h localhost 는 유닉스 소켓을 써서, 초기화 중인 임시 서버
      # (네트워크를 열지 않은 상태)에도 응답이 와 앱이 붙기 전에 healthy 로 판정될 수 있다.
      # $$ 는 compose 치환을 피하고 컨테이너 안의 환경 변수를 쓰게 한다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
