# StyleHub 로컬 개발용 compose — MySQL/Redis만 띄운다.
#
# 운영서버는 Docker가 아니라 java -jar 를 systemd(stylehub.service)로 직접 구동하는
# 네이티브 배포 방식이라(Jenkinsfile 참고), 이 compose로 앱 컨테이너까지 띄우지 않는다.
# 로컬에서 MySQL/Redis를 직접 설치하지 않고 컨테이너로 대체하고 싶을 때만 사용한다.
#
# 사용법:
#   docker compose up -d
#   → application.properties 의 localhost:3306 / localhost:6379 설정과 그대로 맞물린다.
# =========================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: stylehub-mysql
    restart: unless-stopped
    environment:
      # application.properties(로컬)가 root/root로 접속하므로 별도 계정 없이 root를 그대로 씀
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stylehub
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: stylehub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
