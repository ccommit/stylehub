# StyleHub 운영서버 배포용 compose
#
# 위치: 운영서버의 배포 디렉터리(예: /opt/stylehub). 같은 디렉터리의 .env 를
#       docker compose 가 자동으로 읽어 값을 주입한다.
#
# 배포 흐름(Jenkins Deploy 스테이지가 SSH 로 실행):
#   IMAGE_TAG=<빌드번호> docker compose pull app && docker compose up -d app
#
# app 이미지는 로컬에서 빌드하지 않고 GHCR 에서 pull 만 한다.
# mysql/redis 는 데이터 볼륨을 유지하므로 app 만 교체 배포된다.
# =========================================================================

services:
  app:
    image: ghcr.io/ccommit/stylehub:${IMAGE_TAG:-latest}
    container_name: stylehub-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-stylehub}
      DB_USERNAME: ${DB_USERNAME:-stylehub}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
    ports:
      - "8080:8080"
    # 컨테이너에 준 메모리 한도 → 이미지의 MaxRAMPercentage 가 이 값을 기준으로 힙 산정
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5
    networks:
      - stylehub-net

  mysql:
    image: mysql:8.0
    container_name: stylehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-stylehub}
      MYSQL_USER: ${DB_USERNAME:-stylehub}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stylehub-net

  redis:
    image: redis:7-alpine
    container_name: stylehub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stylehub-net

volumes:
  mysql-data:
  redis-data:

networks:
  stylehub-net:
    driver: bridge
