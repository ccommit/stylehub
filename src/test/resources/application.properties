# =========================================================================
# 테스트 전용 설정
#
# 로컬(IDE·Gradle), GitHub Actions, Jenkins 어디서 돌려도 같은 설정으로 테스트가 실행되게 한다.
#
# 이 파일은 src/main/resources/application.properties(개발자 로컬 전용, gitignore)를 "덮어쓴다"가 아니라
# "가린다". 테스트 클래스패스에서 테스트 리소스가 메인 리소스보다 앞에 있고, Boot 는 같은 위치(classpath:/)의
# application.properties 를 하나만 읽기 때문이다. 그래서 로컬 파일의 값(로컬 MySQL 접속, 실제 OAuth·결제 키)은
# 이 파일에 없는 키라도 테스트에 섞이지 않는다. 테스트에 필요한 값은 모두 여기에 둔다.
#
# 실제 시크릿은 절대 넣지 않는다. 퍼블릭 저장소다.
# =========================================================================
spring.application.name=stylehub

# --- DB: H2 인메모리(MySQL 호환 모드) ---------------------------------------
# 운영 DB 가 MySQL 이라 H2 의 MySQL 모드로 문법·동작 차이를 줄인다(H2 문서 권장 URL 옵션: MODE=MySQL;DATABASE_TO_LOWER=TRUE).
# 대소문자 구분 비교(MySQL 기본 콜레이션은 구분하지 않음)까지 같아지지는 않는다.
#
# DB 이름에 ${random.uuid} 를 넣는 이유: 테스트 프레임워크는 설정이 다른 스프링 컨텍스트를 여러 개 캐시해 동시에 살려 둔다.
# 이름이 고정이면 모든 컨텍스트가 같은 인메모리 DB 를 공유하고, 한 컨텍스트가 닫힐 때 create-drop 이 스키마를 지워
# 아직 살아 있는 다른 컨텍스트의 테스트가 깨진다. 이름을 컨텍스트마다 다르게 해 서로 간섭하지 않게 한다.
# DB_CLOSE_DELAY=-1 / DB_CLOSE_ON_EXIT=FALSE 는 Boot 가 내장 H2 에 쓰는 기본 옵션과 같다. 커넥션이 잠시 모두 반납돼도
# DB 가 사라지지 않고, JVM 종료 시 H2 가 먼저 닫혀 스프링 종료 처리(create-drop)가 실패하지 않게 한다.
spring.datasource.url=jdbc:h2:mem:stylehub-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 테스트는 엔티티로 스키마를 만든다. 운영은 validate(application-prod.properties).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# 운영(application-prod.properties)과 같게 끈다. 켜 두면 트랜잭션 밖 지연 로딩처럼 운영에서만 터지는 문제를 테스트가 놓친다.
# OSIV 켜짐/꺼짐을 비교해야 하는 테스트는 @TestPropertySource 로 따로 고정한다.
spring.jpa.open-in-view=false

# --- Redis ---------------------------------------------------------------
# 통합 테스트는 실제 Redis 가 필요하다(분산 락, 선착순 카운터, 세션, 캐시).
# 환경 변수가 이 파일보다 우선하므로 SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT / SPRING_DATA_REDIS_DATABASE 로 덮을 수 있다
# (Jenkins 는 SPRING_DATA_REDIS_HOST=host.docker.internal, 병렬 작업은 SPRING_DATA_REDIS_DATABASE 로 DB 를 나눈다).
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- 외부 연동: 더미 값 ----------------------------------------------------
# 빈 바인딩이 null 로 흘러가지 않게 값만 채운다. 호스트는 RFC 2606 예약 TLD(.invalid)라 실수로 호출해도 외부로 나가지 않는다.
google.client-id=test-google-client-id
google.client-secret=test-google-client-secret
google.redirect-uri=http://localhost:8080/api/v1/users/oauth/google/callback
google.auth-url=https://accounts.google.invalid/o/oauth2/v2/auth
google.token-url=https://oauth2.google.invalid/token
google.userinfo-url=https://www.google.invalid/oauth2/v3/userinfo

toss.payments.secret-key=dummy-toss-secret-key
toss.payments.confirm-url=https://api.tosspayments.invalid/v1/payments/confirm
toss.payments.cancel-url=https://api.tosspayments.invalid/v1/payments
toss.payments.find-by-order-id-url=https://api.tosspayments.invalid/v1/payments/orders
