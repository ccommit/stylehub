spring.application.name=stylehub

# =========================================================================
# local 프로파일 — 저장소만 클론한 상태에서 앱을 띄우기 위한 로컬 개발 설정
#
# 실행: docker compose up -d
#       SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
#       (자세한 순서와 포트 변경 방법은 docker-compose.yml 머리말 참고)
#
# 원칙
#   - 시크릿을 넣지 않는다. 이 파일은 커밋되고 저장소는 공개다.
#     DB 계정은 docker-compose.yml 이 만드는 로컬 전용 계정이고, 포트는 127.0.0.1 에만 열린다.
#   - 외부 연동 키(구글·토스)는 환경 변수로만 받고 기본값을 빈 문자열로 둔다.
#     키가 없어도 기동은 되고, 해당 기능을 호출할 때만 외부 API 가 인증 실패를 돌려준다.
#   - 운영과 동작이 달라지면 로컬에서 재현되지 않는 설정(OSIV, Redis 타임아웃)은 운영 값과 맞춘다.
#
# gitignore 된 application.properties 가 있으면 그 값 위에 이 파일이 덮어써진다.
# =========================================================================

# --- MySQL (docker-compose.yml 의 mysql 서비스) ----------------------------
# LOCAL_MYSQL_PORT·LOCAL_MYSQL_PASSWORD 는 docker-compose.yml 과 같은 이름·기본값이다.
spring.datasource.url=jdbc:mysql://127.0.0.1:${LOCAL_MYSQL_PORT:3306}/stylehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=stylehub
spring.datasource.password=${LOCAL_MYSQL_PASSWORD:stylehub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Redis (docker-compose.yml 의 redis 서비스) ----------------------------
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${LOCAL_REDIS_PORT:6379}
# 운영과 같은 명령 타임아웃. 없으면 Lettuce 기본값(60초)이라 Redis 를 내렸을 때 요청이 운영과 다르게 오래 걸린다.
spring.data.redis.timeout=2s

# --- JPA -----------------------------------------------------------------
# 로컬은 엔티티로 스키마를 자동 반영(update)한다. 빈 DB 에서 바로 뜨게 하려는 편의 설정이다.
# 운영은 validate(스키마 검증만)이고 스키마 변경은 scripts/db 의 DDL 로 따로 반영한다.
# update 는 컬럼·인덱스를 지우거나 타입을 바꾸지 않으므로, 엔티티를 고친 뒤 로컬 스키마가 운영과 어긋날 수 있다.
# 그럴 때는 로컬 볼륨을 새로 만들거나 DDL 을 직접 맞춘다. 데이터를 매번 비우고 싶으면 create 로 바꾼다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 운영과 같이 OSIV 를 끈다. 켜 두면 트랜잭션 밖 지연 로딩이 로컬에서만 동작해 운영에서 처음 LazyInitializationException 을 만난다.
spring.jpa.open-in-view=false

# --- 세션 ----------------------------------------------------------------
# 로컬은 평문 HTTP 라 Secure 쿠키를 끈다. 켜면 브라우저가 세션 쿠키를 보내지 않아 로그인이 유지되지 않는다.
server.servlet.session.cookie.secure=false
spring.session.data.redis.namespace=stylehub:session

# --- Google OAuth --------------------------------------------------------
# 키가 비어 있으면 구글 로그인만 실패한다. 테스트하려면 본인 OAuth 클라이언트 값을 export 한다.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/users/oauth/google/callback}
google.auth-url=https://accounts.google.com/o/oauth2/v2/auth
google.token-url=https://oauth2.googleapis.com/token
google.userinfo-url=https://www.googleapis.com/oauth2/v3/userinfo

# --- Toss Payments -------------------------------------------------------
# 키가 비어 있으면 결제 승인·취소·조회만 실패한다. 테스트하려면 토스 개발자센터의 테스트 시크릿 키를 export 한다.
toss.payments.secret-key=${TOSS_SECRET_KEY:}
toss.payments.confirm-url=https://api.tosspayments.com/v1/payments/confirm
toss.payments.cancel-url=https://api.tosspayments.com/v1/payments
toss.payments.find-by-order-id-url=https://api.tosspayments.com/v1/payments/orders

# --- Actuator ------------------------------------------------------------
# 운영과 같은 엔드포인트를 노출한다. 운영은 관리 포트(9081)를 127.0.0.1 에만 열어 서버 밖에서 닿지 않게 하고,
# 로컬은 편의를 위해 앱 포트에서 그대로 조회한다.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# 로컬에서는 DB·Redis 연결 상태를 바로 보려고 상세를 연다. 운영은 never 다.
management.endpoint.health.show-details=always
