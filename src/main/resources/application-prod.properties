spring.application.name=stylehub

# =========================================================================
# prod 프로파일 — 컨테이너/운영 환경 전용 오버라이드
#
# 원칙: 시크릿(DB 비밀번호, OAuth/결제 키)은 코드나 이미지에 박지 않고
#       런타임 환경변수로만 주입한다. 여기 값이 없으면 앱이 뜨지 않게 해
#       "시크릿 미주입 상태로 운영 기동"을 원천 차단한다.
#
# 시크릿이 *아닌* 설정은 반드시 이 파일에 둔다.
# application.properties 는 로컬 시크릿이 평문으로 들어가 gitignore 되어 있고,
# Jenkins 는 저장소를 클론해 빌드하므로 배포 JAR 에 그 파일이 포함되지 않는다.
# 외부 API 엔드포인트나 커넥션 풀 크기처럼 시크릿이 아닌 값을 그쪽에만 두면
# 운영에서 통째로 사라진다.
#
# 기본값(:뒤)은 docker-compose 서비스명 기준. 원격/관리형 DB 로 바꿀 땐
# .env 의 DB_HOST 등만 덮어쓰면 된다.
# =========================================================================

# --- MySQL ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:stylehub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=${DB_USERNAME:stylehub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.password=${DB_PASSWORD}

# --- Redis ---------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JPA -----------------------------------------------------------------
# 운영 기본은 스키마 검증만(validate). 최초 배포처럼 스키마를 앱이 만들어야
# 하는 상황에선 .env 에서 JPA_DDL_AUTO=update 로 한시적으로 올린다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# 명시하지 않으면 기동 시 커넥션 메타데이터로 추론한다. 대상 DB 가 MySQL 로 고정이므로 못 박는다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# N건 INSERT/UPDATE 를 batch 로 묶어 round-trip 감소. 부하 테스트에서 조정한 값이다.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- 커넥션 풀 / 톰캣 -----------------------------------------------------
# 부하 테스트로 정한 값이다. 이 파일에 없으면 프레임워크 기본값(풀 10, 스레드 200)으로
# 동작해 측정하며 조정한 결과가 운영에 반영되지 않는다.
spring.datasource.hikari.maximum-pool-size=100
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=200

# --- 세션 ----------------------------------------------------------------
# http-only 는 스크립트 접근 차단(XSS), same-site 는 교차 사이트 전송 제한(CSRF) 목적.
# 보안 설정이므로 운영에서 빠지면 안 된다.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.session.redis.namespace=stylehub:session
spring.session.timeout=30m

# --- Google OAuth --------------------------------------------------------
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/users/oauth/google/callback}
# 엔드포인트는 시크릿이 아니다. 없으면 소셜 로그인 흐름 자체가 성립하지 않는다.
google.auth-url=https://accounts.google.com/o/oauth2/v2/auth
google.token-url=https://oauth2.googleapis.com/token
google.userinfo-url=https://www.googleapis.com/oauth2/v3/userinfo

# --- Toss Payments -------------------------------------------------------
toss.payments.secret-key=${TOSS_SECRET_KEY}
# 엔드포인트는 시크릿이 아니다. 없으면 승인/취소/조회 호출 대상이 없다.
toss.payments.confirm-url=https://api.tosspayments.com/v1/payments/confirm
toss.payments.cancel-url=https://api.tosspayments.com/v1/payments
toss.payments.find-by-order-id-url=https://api.tosspayments.com/v1/payments/orders

# --- Actuator ------------------------------------------------------------
# 헬스/인포만 노출 (컨테이너 HEALTHCHECK, LB 헬스체크용). 그 외 엔드포인트는 비공개.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
