# =========================================================================
# prod 프로파일 — 컨테이너/운영 환경 전용 오버라이드
#
# 원칙: 시크릿(DB 비밀번호, OAuth/결제 키)은 코드나 이미지에 박지 않고
#       런타임 환경변수로만 주입한다. 여기 값이 없으면 앱이 뜨지 않게 해
#       "시크릿 미주입 상태로 운영 기동"을 원천 차단한다.
#
# 기본값(:뒤)은 docker-compose 서비스명 기준. 원격/관리형 DB 로 바꿀 땐
# .env 의 DB_HOST 등만 덮어쓰면 된다.
# =========================================================================

# --- MySQL ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:stylehub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=${DB_USERNAME:stylehub}
spring.datasource.password=${DB_PASSWORD}

# --- Redis ---------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JPA -----------------------------------------------------------------
# 운영 기본은 스키마 검증만(validate). 최초 배포처럼 스키마를 앱이 만들어야
# 하는 상황에선 .env 에서 JPA_DDL_AUTO=update 로 한시적으로 올린다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# --- Google OAuth --------------------------------------------------------
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/users/oauth/google/callback}

# --- Toss Payments -------------------------------------------------------
toss.payments.secret-key=${TOSS_SECRET_KEY}

# --- Actuator ------------------------------------------------------------
# 헬스/인포만 노출 (컨테이너 HEALTHCHECK, LB 헬스체크용). 그 외 엔드포인트는 비공개.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
