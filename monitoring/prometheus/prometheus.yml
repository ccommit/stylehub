global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: stylehub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:19081"]
        labels:
          env: ec2

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:19100"]
        labels:
          env: ec2
