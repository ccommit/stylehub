apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-stylehub
    receivers:
      - uid: slack-stylehub
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: slack-stylehub
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
