plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'bwj'
version = '0.0.1-SNAPSHOT'
description = 'stylehub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // 헬스체크(/actuator/health) — 컨테이너 HEALTHCHECK, 무중단 배포 게이트
    implementation 'io.micrometer:micrometer-registry-prometheus' // /actuator/prometheus — JVM/HTTP/DB 커넥션풀 등 메트릭 노출 (수집기는 별도 구성 필요)
    runtimeOnly 'com.mysql:mysql-connector-j' // MySQL JDBC 드라이버 — 컴파일 시 불필요, 런타임에 JPA가 DB 연결 시 사용
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

 
    // Spring Session — 다중 인스턴스 환경에서 세션을 Redis 에 저장 (Tomcat 메모리 세션의 분산 한계 해결)
    // Boot 4 는 세션 자동 설정을 spring-boot-session 모듈로 분리했다. 스타터를 써야 server.servlet.session.cookie.* 와
    // spring.session.* 설정이 실제 쿠키·저장소에 반영된다. spring-session-data-redis 만 두면 이 설정들이 조용히 무시된다.
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
 
    // Spring Cache (Redis 를 CacheManager 로 활용)
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // API 문서(OpenAPI 3 + Swagger UI). 3.0.x 가 Spring Boot 4.0.x 기준으로 빌드된다. 운영 프로파일에서는 끈다
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
 

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // 통합 테스트는 MySQL·Redis 컨테이너에서 돈다. H2 는 InnoDB 와 락 동작이 달라 쓰지 않는다
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 백그라운드 스케줄러가 테스트가 직접 호출하는 만료 처리와 경합하지 않게 끈다 (SchedulingConfig)
    systemProperty 'stylehub.scheduling.enabled', 'false'
    // -Dopenapi.update=true 로 실행하면 OpenApiDocumentTest 가 docs/api/openapi.json 을 현재 코드 기준으로 다시 쓴다
    systemProperty 'openapi.update', System.getProperty('openapi.update', 'false')
}
